<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Visual Novel Recommendation Engine</title>
</head>
<body>
<h1>Visual Novel Recommendation Engine</h1>

<div id="uploadSection">
    <h2>Upload Data Files</h2>
    <p>Upload the three required data files (vn_titles, tags_vn, vndb-votes-YYYY-MM-DD).
from <a href="https://vndb.org/d14#5" target="_blank">https://vndb.org/d14#5</a>

<a href="https://vndb.org/d14#4" target="_blank">https://vndb.org/d14#4</a>
    </p>
    <div>
        <label>VN Titles File: <input type="file" id="vnTitlesFile" /></label>
        <span id="vnTitlesStatus">Waiting</span>
    </div>
    <div>
        <label>Tags Data File: <input type="file" id="tagsFile" /></label>
        <span id="tagsStatus">Waiting</span>
    </div>
    <div>
        <label>User Votes File: <input type="file" id="votesFile" /></label>
        <span id="votesStatus">Waiting</span>
    </div>
    <div id="uploadProgress" style="display:none; margin-top:8px;">
        <div style="width:300px; height:12px; border:1px solid #000;">
            <div id="progressBar" style="background:#4c8; height:100%; width:0%;"></div>
        </div>
        <div id="progressText" style="margin-top:4px; font-size:12px;">0%</div>
    </div>
</div>

<div style="margin-top:16px;">
    <label>Visual Novel ID: <input type="number" id="vnId" placeholder="e.g. 17" /></label>
    <button id="getRecommendations" disabled>Get Recommendations</button>
</div>

<div id="loading" style="display:none; margin-top:12px;">Loading...</div>

<div id="error" style="display:none; color:#b00; margin-top:12px;">
    <strong>Error:</strong> <span id="errorMessage"></span>
</div>

<div id="results" style="display:none; margin-top:16px;">
    <h2>Recommendations</h2>
    <h3>Combined</h3>
    <div id="combinedRecommendations"></div>
    <h3>Tag-based</h3>
    <div id="tagRecommendations"></div>
    <h3>User-based</h3>
    <div id="userRecommendations"></div>
</div>

<script type="module" src="./index.js"></script>
</body>
</html>
